on:
  workflow_call: {}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout commit
      uses: actions/checkout@v7
    - name: Install python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - name: Install pipx
      run: python3 -m pip install --user pipx && python3 -m pipx ensurepath
    - name: Install Poetry with pipx
      run: |
        pipx install poetry
    - name: Setup Python dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-
    - name: Install dependencies
      run: make setup
    - name: Lint
      run: make lint

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout commit
      uses: actions/checkout@v7
    - name: Install python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - name: Install pipx
      run: python3 -m pip install --user pipx && python3 -m pipx ensurepath
    - name: Install Poetry with pipx
      run: |
        pipx install poetry
    - name: Setup Python dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-
    - name: Install dependencies
      run: make setup
    - name: Run unit tests
      run: make test_unit
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: .coverage-unit.xml
        flags: unit
        name: codecov-unit

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      K8S_WAIT_TIMEOUT_SECONDS: "120"
    steps:
    - name: Checkout commit
      uses: actions/checkout@v7
    - name: Install python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - name: Install pipx
      run: python3 -m pip install --user pipx && python3 -m pipx ensurepath
    - name: Install Poetry with pipx
      run: |
        pipx install poetry
    - name: Setup Python dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-
    - name: Install dependencies
      run: make setup
    - name: Build dist
      run: make dist
    - name: Login to ghcr.io
      uses: docker/login-action@v4.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Start minikube
      uses: medyagh/setup-minikube@latest
      id: minikube
      with:
        minikube-version: 1.38.1
        driver: docker
        container-runtime: containerd
        kubernetes-version: v1.34.0
        addons: registry
        start-args: '--nodes 1 --disk-size 30g'
    - uses: azure/setup-helm@v4.3.1
      with:
        version: '3.20.2'
      id: install
    - name: Setup services in minikube
      run: |
        set -euo pipefail
        kubectl create secret docker-registry ghcr-secret --docker-server=https://ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }} --dry-run=client -o yaml | kubectl apply -f -
        make apply_configuration_k8s
        make install_helm_stack
    - name: Wait for k8s readiness
      run: |
        set -euo pipefail
        if ! make wait_k8s_pods_ready; then
          make dump_failed_k8s_logs || true
          exit 1
        fi
    - name: Run k8s smoke test
      run: make test_k8s
    - name: Print k8s state
      run: |
        kubectl get pods -A
        kubectl get jobs -A
    - name: Setup registry port-forward
      run: |
        set -euo pipefail
        kubectl port-forward -n kube-system svc/registry-lb 5000:5000 >/tmp/registry-port-forward.log 2>&1 &
        echo $! >/tmp/registry-port-forward.pid

        for _ in $(seq 1 60); do
          if (echo > /dev/tcp/127.0.0.1/5000) >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        if ! (echo > /dev/tcp/127.0.0.1/5000) >/dev/null 2>&1; then
          echo "Registry port-forward did not become ready in time"
          cat /tmp/registry-port-forward.log || true
          exit 1
        fi

    - name: Run integration tests
      run: |
        set -euo pipefail
        make test_integration
    - name: Stop registry port-forward
      if: always()
      run: |
        if [ -f /tmp/registry-port-forward.pid ]; then
          kill "$(cat /tmp/registry-port-forward.pid)" >/dev/null 2>&1 || true
          rm -f /tmp/registry-port-forward.pid
        fi
    - name: Dump failed k8s logs
      if: failure()
      run: make dump_failed_k8s_logs
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: .coverage-integration.xml
        flags: integration
        name: codecov-integration

  image-upload:
    name: Upload image artifact
    runs-on: ubuntu-latest
    steps:
    - name: Checkout commit
      uses: actions/checkout@v7
    - name: Install python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - name: Install pipx
      run: python3 -m pip install --user pipx && python3 -m pipx ensurepath
    - name: Install Poetry with pipx
      run: |
        pipx install poetry
    - name: Setup Python dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-
    - name: Install dependencies
      run: make setup
    - name: Login to ghcr.io
      uses: docker/login-action@v4.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build Docker image
      run: make docker_build
    - name: Upload image artifact
      uses: neuro-inc/upload-image-action@v24.4.0
      with:
        image: platformmonitoringapi
        token: ${{ github.token }}

  check:
    name: Check
    needs:
    - lint
    - test-unit
    - test-integration
    - image-upload
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
