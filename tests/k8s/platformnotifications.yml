apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformnotifications-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      service: platformnotifications-redis
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: platformnotifications-redis
    spec:
      containers:
      - name: redis
        image: redis:4
---
apiVersion: v1
kind: Service
metadata:
  name: platformnotifications-redis
spec:
  type: LoadBalancer
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    service: platformnotifications-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformnotifications
spec:
  replicas: 1
  selector:
    matchLabels:
      service: platformnotifications
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: platformnotifications
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
      - name: wait-for-config
        image: curlimages/curl:8.4.0
        command: [sh]
        args:
        - -c
        - |
          until curl -fsS -H "Authorization: Bearer $NP_TOKEN" "$NP_PLATFORM_API_URL/api/v1/config" >/dev/null; do
            sleep 1
          done
        env:
        - name: NP_PLATFORM_API_URL
          value: http://platformapi:8080
        - name: NP_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-tokens
              key: token_notification
      containers:
      - name: platformnotifications
        image: ghcr.io/neuro-inc/platformnotificationsapi:latest
        imagePullPolicy: Always
        env:
        - name: NP_LOG_LEVEL
          value: INFO
        - name: NP_NOTIFICATIONS_PLATFORM_API_URL
          value: http://platformapi:8080/api/v1
        - name: NP_NOTIFICATIONS_PLATFORM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-tokens
              key: token_notification
        - name: NP_NOTIFICATIONS_PLATFORM_AUTH_URL
          value: http://platformauthapi:8080
        - name: NP_NOTIFICATIONS_PLATFORM_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-tokens
              key: token_notification
        - name: NP_NOTIFICATIONS_PLATFORM_ADMIN_URL
          value: http://platformadmin:8080
        - name: NP_NOTIFICATIONS_PLATFORM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-tokens
              key: token_notification
        - name: NP_DB_REDIS_URI
          value: redis://platformnotifications-redis:6379/0
        - name: NP_NOTIFICATIONS_TRANSPORT
          value:
        - name: SECURITY_PRIVATE_KEY_BASE64
          value: cHJpdmF0ZSBrZXk=
        - name: SECURITY_JWK_KID
          value: kid
        - name: NP_CONSOLE_URL
          value: http://localhsot:8080
---
apiVersion: v1
kind: Service
metadata:
  name: platformnotifications
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    service: platformnotifications
