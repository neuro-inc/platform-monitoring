apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: elasticsearch-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      service: elasticsearch-logging
  template:
    metadata:
      labels:
        service: elasticsearch-logging
    spec:
      containers:
      - name: elasticsearch-logging
        image: docker.elastic.co/elasticsearch/elasticsearch:6.3.2
        env:
        - name: "ES_JAVA_OPTS"
          value: "-Xms256m -Xmx256m"
        - name: "discovery.type"
          value: "single-node"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-logging
spec:
  type: LoadBalancer
  ports:
  - port: 9200
    targetPort: 9200
  selector:
    service: elasticsearch-logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "admin_access_key_id",
              "secretKey": "admin_secret_access_key"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      service: seaweedfs-s3
  template:
    metadata:
      labels:
        service: seaweedfs-s3
    spec:
      containers:
        - name: seaweedfs-s3
          image: chrislusf/seaweedfs:4.23
          command: ["/bin/sh", "-c"]
          args:
            - |
              weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json &
              WEED_PID=$!
              until wget -qO/dev/null http://localhost:8888/ 2>/dev/null; do
                echo "Waiting for SeaweedFS filer..."
                sleep 2
              done
              printf 's3.bucket.create -name logs\ns3.bucket.create -name loki-logs\n' \
                | weed shell -filer=localhost:8888 || true
              echo "SeaweedFS buckets ready"
              wait $WEED_PID
          ports:
            - containerPort: 9000
              name: s3
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /etc/seaweedfs/s3.json
              name: s3-config
              subPath: s3.json
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
spec:
  type: LoadBalancer
  ports:
  - port: 9000
    targetPort: 9000
  selector:
    service: seaweedfs-s3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %d/%b/%Y:%H:%M:%S %z
        Time_Keep   On

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name             tail
        Path             /var/log/containers/job-*.log
        Parser           cri
        Tag              kube.*
        Refresh_Interval 5
        Mem_Buf_Limit    5MB
        Skip_Long_Lines  On

    [FILTER]
        Name          record_modifier
        Match         kube.*
        Remove_Key    time
        Remove_Key    stream
        Remove_Key    logtag

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name            es
        Match           *
        Host            elasticsearch-logging
        Port            9200
        Retry_Limit     False
        Type            fluent-bit
        Time_Key        @timestamp
        Generate_ID     On
        Replace_Dots    On
        Logstash_Format On
        Logstash_Prefix logstash

    [OUTPUT]
        Name             s3
        Match            *
        endpoint         http://seaweedfs-s3:9000
        bucket           logs
        region           us-east-1
        total_file_size  1M
        upload_timeout   1s
        use_put_object   On
        s3_key_format    /$TAG/%Y%m%d%H%M__$INDEX.gz
        static_file_path On
        json_date_key    time
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - image: fluent/fluent-bit:2.1.10
        name: fluent-bit
        env:
        - name: AWS_ACCESS_KEY_ID
          value: admin_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          value: admin_secret_access_key
        volumeMounts:
        - mountPath: /var/log
          name: varlog
        - mountPath: /var/lib/docker/containers
          name: varlibdockercontainers
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/parsers.conf
          subPath: parsers.conf
          readOnly: true
        - mountPath: /mnt
          name: mnt
          readOnly: true
      volumes:
      - hostPath:
          path: /var/log
          type: ""
        name: varlog
      - hostPath:
          path: /var/lib/docker/containers
          type: ""
        name: varlibdockercontainers
      - name: config
        configMap:
          name: fluent-bit-config
      - hostPath:
          path: /mnt
          type: ""
        name: mnt
